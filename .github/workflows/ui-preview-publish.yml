name: UI Preview Publish

# Publishes the bundle built by ui-preview-build.yml to ghcr.io, where Rocket.Chat Desktop pulls it anonymously
# (`rocketchat://ui-preview?pr=<number>`). The bundle is never extracted or run here.
on:
  workflow_run:
    workflows: [UI Preview Build]
    types: [completed]

permissions: {}

env:
  IMAGE: ghcr.io/rocketchat/rocket.chat-web

jobs:
  publish:
    name: Publish UI preview
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      issues: write
      pull-requests: write

    steps:
      # Absent when the build job was skipped (a label other than ui-preview was added).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ui-preview
          path: ui-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The artifact comes from PR code, so only its PR number is read, and it is checked against GitHub's own data.
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ ! -f ui-preview/pr-number ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number=$(head -c 16 ui-preview/pr-number | tr -d '[:space:]')
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number in artifact"
            exit 1
          fi

          gh api "repos/$REPO/pulls/$number" > pr.json

          if [ "$(jq -r .head.sha pr.json)" != "$HEAD_SHA" ]; then
            echo "PR #$number moved past $HEAD_SHA; a newer build will publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          fork=$(jq -r --arg repo "$REPO" '.head.repo.full_name != $repo' pr.json)
          labeled=$(jq -r 'any(.labels[]; .name == "ui-preview")' pr.json)
          if [ "$fork" = "true" ] && [ "$labeled" != "true" ]; then
            echo "Fork PR #$number needs the ui-preview label from a maintainer."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "number=$number"
            echo "fork=$fork"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        if: steps.pr.outputs.publish == 'true'

      - name: Push to ghcr.io
        if: steps.pr.outputs.publish == 'true'
        env:
          CR_USER: ${{ secrets.CR_USER }}
          CR_PAT: ${{ secrets.CR_PAT }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "$CR_PAT" | oras login ghcr.io -u "$CR_USER" --password-stdin
          cd ui-preview
          oras push "$IMAGE:pr-$NUMBER,$HEAD_SHA" \
            --artifact-type application/vnd.rocketchat.ui-preview.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$REPO" \
            --annotation "org.opencontainers.image.revision=$HEAD_SHA" \
            ui-preview.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip

      # A fork's later pushes must be reviewed again before they are published.
      - name: Remove ui-preview label from fork PR
        if: steps.pr.outputs.publish == 'true' && steps.pr.outputs.fork == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/ui-preview"

      - name: Comment on PR
        if: steps.pr.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          marker='<!-- ui-preview -->'
          body="$marker
          ### 🖥️ UI preview

          Built from \`${HEAD_SHA:0:7}\` and published to \`$IMAGE:pr-$NUMBER\`.

          In Rocket.Chat Desktop with **Developer Mode** on, open one of these links to load this PR's UI into the workspace in focus:

          | | |
          |---|---|
          | Latest build of this PR | \`rocketchat://ui-preview?pr=$NUMBER\` |
          | This exact build | \`rocketchat://ui-preview?pr=$NUMBER&sha=$HEAD_SHA\` |

          To pick the workspace, add \`&host=https://your.server\`. Use **View > Restore server UI**, or restart the app, to go back."

          comment_id=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body"
          else
            gh api "repos/$REPO/issues/$NUMBER/comments" -f body="$body"
          fi
