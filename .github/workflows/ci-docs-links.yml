name: Docs link check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-docs-links*.mjs'
      - '.github/workflows/ci-docs-links.yml'

permissions: {}

jobs:
  docs-links:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    name: Check /docs internal links
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the link checker
        run: node --test scripts/check-docs-links.test.mjs

      - name: Check internal links in /docs
        run: node scripts/check-docs-links.mjs docs
