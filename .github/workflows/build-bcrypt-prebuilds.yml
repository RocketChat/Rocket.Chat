# Builds napi-v3 prebuilt binaries for bcrypt 5.0.1 forced onto node-addon-api 8,
# which (unlike the nested node-addon-api ^3.1.0 bcrypt pins) compiles on Node 24.
# Meteor's accounts-password bundles bcrypt 5.0.1 and there is no upstream linux-arm64
# prebuild, so CI/Docker fall back to a source compile that fails on Node 24.
# Host the artifacts produced here and point node-pre-gyp at them via
# `npm_config_bcrypt_lib_binary_host_mirror`. napi-v3 is ABI-stable across Node versions.
name: Build bcrypt prebuilds

on:
  workflow_dispatch:
  # ponytail: temporary — lets this run from the PR branch before it lands on the
  # default branch (workflow_dispatch only dispatches from default). Drop once verified.
  push:
    branches: [chore/meteor-3.5-rc.2]
    paths: ['.github/workflows/build-bcrypt-prebuilds.yml']

env:
  BCRYPT_VERSION: 5.0.1
  NODE_ADDON_API: ^8.0.0
  NODE_VERSION: 24.15.0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-glibc
            runs-on: ubuntu-24.04
          - target: linux-arm64-glibc
            runs-on: ubuntu-24.04-arm
          - target: linux-arm64-musl
            runs-on: ubuntu-24.04-arm
            container: node:24.15.0-alpine3.23
    steps:
      - name: Install build deps (alpine/musl)
        if: matrix.container != ''
        run: apk add --no-cache python3 make g++ libc6-compat tar

      - name: Setup Node (glibc)
        if: matrix.container == ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and package bcrypt
        shell: bash
        run: |
          set -eux
          work="$(mktemp -d)"
          cd "$work"
          cat > package.json <<EOF
          {
            "name": "bcrypt-prebuild",
            "version": "1.0.0",
            "dependencies": { "bcrypt": "${BCRYPT_VERSION}" },
            "overrides": { "bcrypt": { "node-addon-api": "${NODE_ADDON_API}" } }
          }
          EOF
          npm install --build-from-source=bcrypt --foreground-scripts
          node -e "require('bcrypt').hashSync('x', 8)" # smoke test the freshly built binary
          cd node_modules/bcrypt
          npx --yes @mapbox/node-pre-gyp package
          mkdir -p "$GITHUB_WORKSPACE/out"
          find build/stage -name '*.tar.gz' -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -l "$GITHUB_WORKSPACE/out"

      - name: Upload prebuild
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bcrypt-prebuild-${{ matrix.target }}
          path: out/*.tar.gz
          if-no-files-found: error
