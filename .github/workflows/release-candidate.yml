name: Release candidate cut
on:
  schedule:
    - cron: '28 21 20 * *' # run at minute 28 to avoid the chance of delay due to high load on GH
jobs:
  new-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.CI_PAT }}

      - name: Read tool versions
        id: versions
        run: |
          NODE_VERSION=$(node -p "require('./package.json').engines.node")
          echo "node-version=${NODE_VERSION}" >> $GITHUB_OUTPUT

          DENO_VERSION=$(awk '$1=="deno"{ print $2 }' .tool-versions)
          echo "deno-version=${DENO_VERSION}" >> $GITHUB_OUTPUT

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ steps.versions.outputs.node-version }}
          deno-version: ${{ steps.versions.outputs.deno-version }}
          cache-modules: true
          install: true
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: rharkor/caching-for-turbo@00a0515f175df9fd2e15c4560144ad5fdbebb0c7 # v2.3.13

      - name: Build packages
        run: yarn build

      - name: 'Start release candidate'
        uses: ./packages/release-action
        with:
          action: next
          base-ref: ${{ github.ref_name }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CI_PAT }}
