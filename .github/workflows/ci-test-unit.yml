name: Tests Unit

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      deno-version:
        required: true
        type: string
      enterprise-license:
        required: false
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

env:
  MONGO_URL: mongodb://localhost:27017/rocketchat?replicaSet=rs0&directConnection=true
  TOOL_NODE_FLAGS: ${{ vars.TOOL_NODE_FLAGS }}
  ENTERPRISE_LICENSE: ${{ inputs.enterprise-license }}

jobs:
  test:
    runs-on: ubuntu-24.04-arm

    name: Unit Tests

    steps:
      - uses: actions/checkout@v6

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ inputs.node-version }}
          deno-version: ${{ inputs.deno-version }}
          cache-modules: true
          install: true
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: rharkor/caching-for-turbo@v1.8

      - uses: ./.github/actions/restore-packages

      - name: Unit Test
        run: yarn testunit --concurrency=1

      - name: Debug coverage files
        run: |
          echo "=== Jest lcov (first 20 lines) ==="
          head -20 apps/meteor/coverage/jest/lcov.info || echo "FILE NOT FOUND"
          echo ""
          echo "=== nyc lcov (first 20 lines) ==="
          head -20 apps/meteor/coverage/nyc/lcov.info || echo "FILE NOT FOUND"
          echo ""
          echo "=== File sizes ==="
          wc -l apps/meteor/coverage/jest/lcov.info apps/meteor/coverage/nyc/lcov.info || true

      - uses: codecov/codecov-action@v6
        with:
          flags: unit
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/meteor/coverage/jest/lcov.info,apps/meteor/coverage/nyc/lcov.info
          disable_search: true

      - uses: codecov/codecov-action@v6
        with:
          flags: packages
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
          exclude: apps/meteor/coverage/**
