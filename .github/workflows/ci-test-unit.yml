name: Tests Unit

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      deno-version:
        required: true
        type: string
      enterprise-license:
        required: false
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false
      NPM_TOKEN:
        required: false

env:
  MONGO_URL: mongodb://localhost:27017/rocketchat?replicaSet=rs0&directConnection=true
  TOOL_NODE_FLAGS: ${{ vars.TOOL_NODE_FLAGS }}
  ENTERPRISE_LICENSE: ${{ inputs.enterprise-license }}

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    name: Unit Tests

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ inputs.node-version }}
          deno-version: ${{ inputs.deno-version }}
          cache-modules: true
          install: true
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: rharkor/caching-for-turbo@75f8ebf4a43d2c60b23bc2a27082cfea94ffdad9 # v2.5.0

      - uses: ./.github/actions/restore-packages

      - name: Unit Test
        run: yarn testunit --concurrency=1

      - uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          flags: unit
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
