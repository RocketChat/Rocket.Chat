name: Release (manual or scheduled)

on:
  workflow_call:
    inputs:
      action:
        description: "Release action: next, patch, or cut"
        required: true
        type: string
      base-ref:
        description: "Base ref to use for the release"
        required: false
        type: string
        default: develop
    secrets:
      CI_PAT:
        required: true
      NPM_TOKEN:
        required: true

env:
  HUSKY: 0

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs['base-ref'] }}
          fetch-depth: 0
          token: ${{ secrets.CI_PAT }}

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node
        with:
          cache-modules: true
          install: true
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
      - name: Build packages
        run: yarn build
      - name: 'Start release: ${{ inputs.action }}'
        uses: ./packages/release-action
        with:
          action: ${{ inputs.action }}
          base-ref: ${{ inputs['base-ref'] }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CI_PAT }}
