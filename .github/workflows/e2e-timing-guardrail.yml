name: E2E Timing Guardrail

on:
  schedule:
    # Mondays 09:00 UTC — the week's signal, before most merges land
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      threshold_ms:
        description: 'p50 threshold per test, in ms'
        required: false
        default: '3000'

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download the latest successful e2e trace artifact from develop
        id: dl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=$(gh run list \
            --branch develop \
            --workflow ci.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "${run_id:-}" ]; then
            echo "No successful ci.yml run on develop — skipping" >&2
            echo "has_artifact=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p artifacts
          # Artifact name from ci-test-e2e.yml: playwright-test-trace-<release>-<mongo>-<shard>
          if ! gh run download "$run_id" \
            --pattern 'playwright-test-trace-*' \
            --dir artifacts; then
            echo "No playwright-test-trace-* artifact in run $run_id — skipping" >&2
            echo "has_artifact=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_artifact=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Generate timing report
        if: steps.dl.outputs.has_artifact == 'true'
        env:
          THRESHOLD: ${{ inputs.threshold_ms || '3000' }}
          RUN_ID: ${{ steps.dl.outputs.run_id }}
        run: |
          set -euo pipefail
          # Each shard produces one results.json — concatenate their markdown
          # outputs (threshold-filter runs per shard, dedup is cheap post-hoc).
          {
            echo "# E2E timing guardrail"
            echo ""
            echo "Source: [ci.yml run $RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID) on \`develop\`."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          found=0
          for json in artifacts/*/results.json; do
            [ -f "$json" ] || continue
            found=$((found + 1))
            shard=$(basename "$(dirname "$json")")
            {
              echo "## \`$shard\`"
              echo ""
              node --experimental-strip-types apps/meteor/tests/e2e/scripts/e2e-timing-report.mts "$json" "$THRESHOLD"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found" -eq 0 ]; then
            echo "No results.json found in downloaded artifacts — the workflow may predate JSON-reporter rollout." >> "$GITHUB_STEP_SUMMARY"
          fi
