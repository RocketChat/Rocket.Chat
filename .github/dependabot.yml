version: 2
updates:
  # Main repo NPM package
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # Matches npmMinimalAgeGate in .yarnrc.yml, so Yarn can install the versions that version updates propose.
    # Security updates ignore the cooldown: a fix published less than 3 days ago must be added to
    # npmPreapprovedPackages in .yarnrc.yml before it can be installed.
    cooldown:
      default-days: 3
    labels:
      - 'automerge'

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      # CodeQL steps must all run the same version, so they have to be bumped together
      codeql-action:
        patterns:
          - 'github/codeql-action*'
