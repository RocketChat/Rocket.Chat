<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>How a video call ends, and what the call history records</title>
	<desc>A call is in everyone's history from the moment it starts, as ongoing. It ends when the last participant closes their window, when the only participant joins another call, or — if nothing ever reports an end — when the expiry cron reaches it after 24 hours. A reload also reports leaving, which is why an emptied call waits ten seconds before ending. When it ends, each member's row settles to ended or not-answered.</desc>
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
		</marker>
	</defs>

	<rect x="180" y="40" width="320" height="56" rx="4" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
	<text x="340" y="64" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">A call is running</text>
	<text x="340" y="82" text-anchor="middle" font-size="12" fill="#0F6E56">already a row in everyone's history, as ongoing</text>

	<path d="M340 96 L340 112 L165 112 L165 134" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<path d="M340 96 L340 112 L515 112 L515 134" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="40" y="136" width="250" height="56" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
	<text x="165" y="160" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">The last person leaves</text>
	<text x="165" y="178" text-anchor="middle" font-size="12" fill="#5F5E5A">window closed, or navigated away</text>

	<rect x="390" y="136" width="250" height="56" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
	<text x="515" y="160" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">They join another call</text>
	<text x="515" y="178" text-anchor="middle" font-size="12" fill="#5F5E5A">the server leaves this one</text>

	<rect x="40" y="210" width="250" height="56" rx="4" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
	<text x="165" y="234" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Someone reloads</text>
	<text x="165" y="252" text-anchor="middle" font-size="12" fill="#185FA5">leaving is reported either way</text>

	<rect x="390" y="210" width="250" height="56" rx="4" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
	<text x="515" y="234" text-anchor="middle" font-size="14" font-weight="500" fill="#412402">Nothing reports an end</text>
	<text x="515" y="252" text-anchor="middle" font-size="12" fill="#854F0B">expiry reaches it after 24h</text>

	<path d="M165 192 L165 210" fill="none" stroke="#888780" stroke-width="1.5"/>
	<path d="M165 266 L165 288 L300 288 L300 308" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<path d="M515 192 L515 210" fill="none" stroke="#888780" stroke-width="1.5"/>
	<path d="M515 266 L515 288 L380 288 L380 308" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="190" y="310" width="300" height="56" rx="4" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
	<text x="340" y="334" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">Empty for ten seconds</text>
	<text x="340" y="352" text-anchor="middle" font-size="12" fill="#993C1D">a reload gets back inside the grace</text>

	<line x1="340" y1="366" x2="340" y2="390" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="140" y="392" width="400" height="56" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
	<text x="340" y="416" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">Every member's row settles</text>
	<text x="340" y="434" text-anchor="middle" font-size="12" fill="#534AB7">ended for whoever joined, not-answered for whoever did not</text>
</svg>
