<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>What happens when a call rings you</title>
	<desc>A ring reaches you as the first item of your ongoing-calls list, and as a desktop notification when the app is not on screen. You can accept, decline, silence it, or ignore it — each with a different outcome. Declining is recorded against your own membership only and never ends the call for anyone else.</desc>
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
		</marker>
	</defs>

	<rect x="30" y="130" width="180" height="76" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
	<text x="120" y="158" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">A call rings you</text>
	<text x="120" y="176" text-anchor="middle" font-size="12" fill="#5F5E5A">top of your call list,</text>
	<text x="120" y="192" text-anchor="middle" font-size="12" fill="#5F5E5A">or a notification</text>

	<path d="M210 150 L235 150 L235 66 L258 66" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<path d="M210 162 L235 162 L235 146 L258 146" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<path d="M210 174 L235 174 L235 226 L258 226" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<path d="M210 186 L235 186 L235 306 L258 306" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="260" y="40" width="160" height="52" rx="4" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
	<text x="340" y="62" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Accept</text>
	<text x="340" y="79" text-anchor="middle" font-size="12" fill="#0F6E56">joins outright</text>

	<rect x="260" y="120" width="160" height="52" rx="4" fill="#FCEBEB" stroke="#F09595" stroke-width="0.5"/>
	<text x="340" y="142" text-anchor="middle" font-size="14" font-weight="500" fill="#501313">Decline</text>
	<text x="340" y="159" text-anchor="middle" font-size="12" fill="#A32D2D">your entry only</text>

	<rect x="260" y="200" width="160" height="52" rx="4" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
	<text x="340" y="222" text-anchor="middle" font-size="14" font-weight="500" fill="#412402">Silence</text>
	<text x="340" y="239" text-anchor="middle" font-size="12" fill="#854F0B">stops the sound</text>

	<rect x="260" y="280" width="160" height="52" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
	<text x="340" y="302" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Ignore</text>
	<text x="340" y="319" text-anchor="middle" font-size="12" fill="#5F5E5A">15 seconds pass</text>

	<line x1="420" y1="66" x2="448" y2="66" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<line x1="420" y1="146" x2="448" y2="146" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<line x1="420" y1="226" x2="448" y2="226" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<line x1="420" y1="306" x2="448" y2="306" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="450" y="40" width="200" height="52" rx="4" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
	<text x="550" y="62" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">In the call</text>
	<text x="550" y="79" text-anchor="middle" font-size="12" fill="#0F6E56">after the preflight</text>

	<rect x="450" y="120" width="200" height="52" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
	<text x="550" y="142" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">The call goes on</text>
	<text x="550" y="159" text-anchor="middle" font-size="12" fill="#5F5E5A">you can still join later</text>

	<rect x="450" y="200" width="200" height="52" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
	<text x="550" y="222" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Still listed</text>
	<text x="550" y="239" text-anchor="middle" font-size="12" fill="#5F5E5A">decide in your own time</text>

	<rect x="450" y="280" width="200" height="52" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
	<text x="550" y="302" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">An ordinary row</text>
	<text x="550" y="319" text-anchor="middle" font-size="12" fill="#5F5E5A">it stops asking</text>
</svg>
