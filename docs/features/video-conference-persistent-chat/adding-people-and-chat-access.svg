<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Adding people to a call, and whether they can read its chat</title>
	<desc>Adding someone makes them a member of the conference, not of any room. Someone already in the room can read the chat; anyone from outside cannot, and is marked no chat access. Once such a member actually joins, a notice offers a remedy: a public channel leads with adding them to the room, a private group leads with moving the chat to a discussion, and a direct message offers only the discussion.</desc>
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
			<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
		</marker>
	</defs>

	<rect x="170" y="40" width="340" height="52" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
	<text x="340" y="62" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Add people from the members panel</text>
	<text x="340" y="79" text-anchor="middle" font-size="12" fill="#5F5E5A">up to 10 at once, and every one of them rings</text>

	<path d="M340 92 L340 108 L180 108 L180 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<path d="M340 92 L340 108 L500 108 L500 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="55" y="130" width="250" height="60" rx="4" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
	<text x="180" y="154" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Already in the room</text>
	<text x="180" y="172" text-anchor="middle" font-size="12" fill="#0F6E56">they can read the chat</text>

	<rect x="375" y="130" width="250" height="60" rx="4" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
	<text x="500" y="154" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">From outside the room</text>
	<text x="500" y="172" text-anchor="middle" font-size="12" fill="#993C1D">marked no chat access</text>

	<line x1="500" y1="190" x2="500" y2="214" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="330" y="216" width="300" height="60" rx="4" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
	<text x="480" y="240" text-anchor="middle" font-size="14" font-weight="500" fill="#412402">Notice, once they join</text>
	<text x="480" y="258" text-anchor="middle" font-size="12" fill="#854F0B">only shown to people who can fix it</text>

	<path d="M480 276 L480 292 L125 292 L125 314" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<path d="M480 276 L480 292 L340 292 L340 314" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<path d="M480 276 L480 292 L555 292 L555 314" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="40" y="316" width="170" height="60" rx="4" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
	<text x="125" y="340" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Public channel</text>
	<text x="125" y="358" text-anchor="middle" font-size="12" fill="#185FA5">leads with the invite</text>

	<rect x="255" y="316" width="170" height="60" rx="4" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
	<text x="340" y="340" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Private group</text>
	<text x="340" y="358" text-anchor="middle" font-size="12" fill="#185FA5">leads with a discussion</text>

	<rect x="470" y="316" width="170" height="60" rx="4" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
	<text x="555" y="340" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Direct message</text>
	<text x="555" y="358" text-anchor="middle" font-size="12" fill="#185FA5">discussion only</text>

	<path d="M125 376 L125 396 L190 396 L190 416" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<path d="M340 376 L340 396 L190 396 L190 416" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
	<path d="M340 376 L340 396 L480 396 L480 416" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
	<path d="M555 376 L555 396 L480 396 L480 416" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="60" y="418" width="260" height="56" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
	<text x="190" y="442" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">Added to the room</text>
	<text x="190" y="460" text-anchor="middle" font-size="12" fill="#534AB7">its whole history opens to them</text>

	<rect x="360" y="418" width="260" height="56" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
	<text x="490" y="442" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">Chat moves to a discussion</text>
	<text x="490" y="460" text-anchor="middle" font-size="12" fill="#534AB7">everyone in the call follows it</text>
</svg>
