global:
  # the exporter refreshes its values every 5 s
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # The Rocket.Chat exporter of each instance on the ports of PLAN.md section 3. With AGENT_STREAM_OBSERVABILITY=1,
  # start-instance.sh puts the exporter on the instance port + 10000. Never add the harness /metrics route: a read resets it.
  - job_name: rocketchat
    static_configs:
      - targets: ['host.docker.internal:13000', 'host.docker.internal:13002']
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
