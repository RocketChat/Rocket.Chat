AWSTemplateFormatVersion: '2010-09-09'
Description: >
  LiveKit Egress on-demand: Auto Scaling Group (min=0, max=1) that boots
  an egress worker connected to core.yaml's LK + Redis. Scaling decisions
  are made by a polling script running on the core box (see
  core.yaml `scale-egress.py`), so this stack has no webhook receiver,
  Lambda, or API Gateway.

  The ASG is named `${CoreStackName}-egress-asg` by convention — that's the
  same name the core scaler is granted SetDesiredCapacity on.

Parameters:
  CoreStackName:
    Type: String
    Description: >
      Name of the core LK stack (deployed via core.yaml). Used to import
      VPC, subnet, the EgressClientsSG (for Redis access), and the public
      LK domain. Also determines the ASG name the core scaler will drive.

  LiveKitApiKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Same value passed to core.yaml. Egress uses it to register.

  LiveKitApiSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Same value as core.yaml.

  InstanceType:
    Type: String
    Default: t4g.xlarge
    AllowedValues: [t4g.xlarge, t4g.2xlarge, c7g.xlarge, c7g.2xlarge, m5.xlarge, c5.xlarge, c5.2xlarge]
    Description: >
      Egress runs Chromium (room-composite recording). 4 vCPU minimum;
      8 vCPU recommended for multiple concurrent recordings.

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair for SSH access.

  AmiX8664:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  AmiArm64:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

  LiveKitEgressVersion:
    Type: String
    Default: latest
    Description: Docker tag for livekit/egress.

Conditions:
  UseArm64Ami: !Or
    - !Equals [!Ref InstanceType, t4g.xlarge]
    - !Equals [!Ref InstanceType, t4g.2xlarge]
    - !Equals [!Ref InstanceType, c7g.xlarge]
    - !Equals [!Ref InstanceType, c7g.2xlarge]

Resources:
  # ---------------------------------------------------------------------------
  # Egress instances' SG. The core stack's EgressClientsSG (also attached)
  # is what grants the actual Redis ingress on the core box. This SG just
  # holds SSH for debugging.
  # ---------------------------------------------------------------------------
  EgressSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress instances
      VpcId:
        Fn::ImportValue: !Sub "${CoreStackName}-VpcId"
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0, Description: SSH }

  # ---------------------------------------------------------------------------
  # IAM — SSM only.
  # ---------------------------------------------------------------------------
  EgressInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  EgressInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EgressInstanceRole]

  # ---------------------------------------------------------------------------
  # Launch Template — boots an egress instance connected to core's Redis.
  # ---------------------------------------------------------------------------
  EgressLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${CoreStackName}-egress"
      LaunchTemplateData:
        ImageId: !If [UseArm64Ami, !Ref AmiArm64, !Ref AmiX8664]
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyPairName
        IamInstanceProfile: { Arn: !GetAtt EgressInstanceProfile.Arn }
        SecurityGroupIds:
          - !Ref EgressSG
          - Fn::ImportValue: !Sub "${CoreStackName}-EgressClientsSGId"
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 30, VolumeType: gp3, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${CoreStackName}-egress"
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -euxo pipefail
              exec > >(tee -a /var/log/user-data.log) 2>&1

              dnf update -y
              dnf install -y docker
              systemctl enable --now docker
              usermod -aG docker ec2-user

              mkdir -p /usr/libexec/docker/cli-plugins
              COMPOSE_VER=v2.30.3
              ARCH=$(uname -m)
              case "$ARCH" in
                x86_64)  COMPOSE_ARCH=x86_64 ;;
                aarch64) COMPOSE_ARCH=aarch64 ;;
              esac
              curl -fsSL \
                "https://github.com/docker/compose/releases/download/${!COMPOSE_VER}/docker-compose-linux-${!COMPOSE_ARCH}" \
                -o /usr/libexec/docker/cli-plugins/docker-compose
              chmod +x /usr/libexec/docker/cli-plugins/docker-compose

              mkdir -p /opt/egress
              cd /opt/egress

              cat > egress.yaml <<YAML
              api_key: ${LiveKitApiKey}
              api_secret: ${LiveKitApiSecret}
              ws_url: wss://${LkDomain}
              redis:
                address: ${LkPrivateIp}:6379
              insecure: false
              log_level: info
              YAML

              cat > docker-compose.yml <<YAML
              services:
                egress:
                  image: livekit/egress:${LiveKitEgressVersion}
                  network_mode: host
                  restart: unless-stopped
                  cap_add:
                    - SYS_ADMIN
                  environment:
                    EGRESS_CONFIG_FILE: /egress.yaml
                  volumes:
                    - ./egress.yaml:/egress.yaml:ro
              YAML

              docker compose pull
              docker compose up -d
            - LkDomain:
                Fn::ImportValue: !Sub "${CoreStackName}-PublicDomain"
              LkPrivateIp:
                Fn::ImportValue: !Sub "${CoreStackName}-PrivateIp"

  # ---------------------------------------------------------------------------
  # Auto Scaling Group. Name is by convention so the core scaler can grant
  # SetDesiredCapacity on a known ARN at template-write time.
  # ---------------------------------------------------------------------------
  EgressASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${CoreStackName}-egress-asg"
      LaunchTemplate:
        LaunchTemplateId: !Ref EgressLaunchTemplate
        Version: !GetAtt EgressLaunchTemplate.LatestVersionNumber
      MinSize: 0
      MaxSize: 1
      DesiredCapacity: 0
      VPCZoneIdentifier:
        - Fn::ImportValue: !Sub "${CoreStackName}-SubnetId"
      HealthCheckType: EC2
      HealthCheckGracePeriod: 180
      Tags:
        - Key: Name
          Value: !Sub "${CoreStackName}-egress"
          PropagateAtLaunch: true

Outputs:
  AsgName:
    Description: Auto Scaling Group name (matches what the core scaler is granted to drive).
    Value: !Ref EgressASG

  NextSteps:
    Description: What to do after CREATE_COMPLETE.
    Value: !Sub |
      No further wiring needed. The core stack's local scaler picks up the
      ASG on its next poll tick (~5s). Verify with:

        # Tail the scaler log on core (SSH first):
        sudo journalctl -u lk-scaler -f

        # Watch ASG capacity flip when a call starts:
        aws autoscaling describe-auto-scaling-groups \
          --auto-scaling-group-names ${EgressASG} \
          --query 'AutoScalingGroups[0].[DesiredCapacity,length(Instances)]' \
          --output text
