name: Changeset release
description: Action to cut and publish releases using changesets

inputs:
  action:
    description: "The main action to perform: publish, publish-final, bump, patch or sync-develop"
    required: true
  base-ref:
    description: "Base ref to use for the release"
    required: false
  lts-versions:
    description: "Comma separated list of LTS minor versions (e.g. 7.10,8.4)"
    required: false

runs:
  using: "node24"
  main: "dist/index.js"

branding:
  icon: "package"
  color: "blue"
